name: Firmware build

on:
  push:
    paths:
      - ZephyrFirmware/**
  pull_request:
    paths:
      - ZephyrFirmware/**
  workflow_call:

permissions:
  contents: read

jobs:
  build-firmware-zephyr:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Install cmake
      run: sudo apt update && sudo apt install -y cmake

    - name: Setup Zephyr project
      uses: zephyrproject-rtos/action-zephyr-setup@cc223fe61661d8573c1cd3f95f72f90cce729ae9 # v1
      with:
          base-path: ZephyrFirmware
          app-path: app
          toolchains: arm-zephyr-eabi

    - name: Build
      working-directory: ZephyrFirmware
      run: |
        west build -b nrf52840dk/nrf52840 app